server {
    listen 80;
    listen [::]:80;
    server_name anime.YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 200 "ANIME CUP certificate bootstrap\n";
    }
}
